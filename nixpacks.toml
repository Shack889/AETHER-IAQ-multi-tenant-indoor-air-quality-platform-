# Railway / Nixpacks build config.
#
# The reports feature renders PDFs with headless Chromium (Puppeteer). Puppeteer
# downloads its own Chrome-for-Testing during `npm install`, but that binary
# still needs system shared libraries to launch, and `unzip` to extract during
# install. Without these the default Nixpacks image cannot start Chromium and
# every report request returns 503 (pdf_engine_unavailable).
#
# These apt packages provide the extractor + Chromium's runtime libs.
[phases.setup]
aptPkgs = [
  "unzip",
  "libnss3",
  # NOTE: Ubuntu 24.04 (Noble) renamed several libs for the 64-bit time_t
  # transition — these MUST carry the t64 suffix or apt has "no installation
  # candidate" and the Chromium image build fails. Verified against the Noble
  # apt index; the non-suffixed names below were not renamed.
  "libatk1.0-0t64",
  "libatk-bridge2.0-0t64",
  "libcups2t64",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2t64",
  "libpango-1.0-0",
  "libcairo2",
  "libatspi2.0-0t64",
  "libxshmfence1",
  "fonts-liberation",
]

# Puppeteer's browser cache location is pinned in .puppeteerrc.cjs (resolved
# relative to that file) so the install phase and the runtime phase agree on one
# path. A build-time env var here would NOT propagate to the runtime container,
# which is exactly what left Chromium unfindable at launch.
